<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0d1117"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><radialGradient id="glowLeft" cx="15%" cy="30%" r="50%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glowRight" cx="85%" cy="70%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><radialGradient id="glowCenter" cx="50%" cy="50%" r="40%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".15"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#374151" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity=".4"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".5" stdDeviation="8"/></filter><filter id="glowEffect" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.7}50%{transform:scale(1.15) translate(15px,-10px);opacity:.95}}@keyframes floatCard1{0%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatCard2{0%{transform:translateY(0) rotate(1.5deg)}50%{transform:translateY(-15px) rotate(-.5deg)}}@keyframes pingDot{0%{r:3;opacity:.5}50%{r:6;opacity:1}}.orb-pulse{animation:pulseOrb 8s ease-in-out infinite}.card-float-1{animation:floatCard1 6s ease-in-out infinite}.card-float-2{animation:floatCard2 7s ease-in-out infinite}.dash-line{stroke-dasharray:6 6;animation:dashCycle 2.5s linear infinite}.beacon{animation:pingDot 3s ease-in-out infinite}.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800}.font-sub{font-weight:500}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><rect width="1200" height="400" fill="url(#grid)"/><circle cx="180" cy="120" r="260" fill="url(#glowLeft)" class="orb-pulse"/><circle cx="1020" cy="280" r="280" fill="url(#glowRight)" class="orb-pulse" style="animation-delay:-3s"/><circle cx="600" cy="200" r="320" fill="url(#glowCenter)"/><g opacity=".65"><path fill="none" stroke="#6366f1" stroke-width="2" d="M 120 80 Q 250 140 380 90 T 600 130 T 820 90 T 1080 120" class="dash-line" opacity=".4"/><path fill="none" stroke="#ec4899" stroke-width="1.8" d="M 100 320 Q 300 260 520 310 T 800 290 T 1100 330" class="dash-line" opacity=".35" style="animation-duration:3.5s"/><g class="card-float-1" transform="translate(60, 160)"><rect width="130" height="48" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" filter="url(#shadow)" opacity=".85" rx="10"/><circle cx="22" cy="24" r="5" fill="#ec4899" class="beacon"/><text x="36" y="28" fill="#e5e7eb" class="font-sub" font-size="12">💡 Ideate</text></g><g class="card-float-2" transform="translate(100, 240)"><rect width="140" height="48" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" filter="url(#shadow)" opacity=".85" rx="10"/><circle cx="22" cy="24" r="5" fill="#8b5cf6" class="beacon" style="animation-delay:1s"/><text x="36" y="28" fill="#e5e7eb" class="font-sub" font-size="12">🗺️ Mind Map</text></g><g class="card-float-2" transform="translate(1000, 1