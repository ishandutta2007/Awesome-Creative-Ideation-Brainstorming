<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.4" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.95; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(1.5deg); }
      50% { transform: translateY(-15px) rotate(-0.5deg); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pingDot {
      0%, 100% { r: 3; opacity: 0.5; }
      50% { r: 6; opacity: 1; }
    }
    .orb-pulse { animation: pulseOrb 8s ease-in-out infinite; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .dash-line { stroke-dasharray: 6 6; animation: dashCycle 2.5s linear infinite; }
    .beacon { animation: pingDot 3s ease-in-out infinite; }
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Light Fields -->
  <circle cx="180" cy="120" r="260" fill="url(#glowLeft)" class="orb-pulse" />
  <circle cx="1020" cy="280" r="280" fill="url(#glowRight)" class="orb-pulse" style="animation-delay: -3s;" />
  <circle cx="600" cy="200" r="320" fill="url(#glowCenter)" />

  <!-- DYNAMIC BACKGROUND VISUAL ELEMENTS (Behind foreground text) -->
  <g opacity="0.65">
    <!-- Connecting Mind Map Neural / Canvas Paths -->
    <path d="M 120 80 Q 250 140 380 90 T 600 130 T 820 90 T 1080 120" fill="none" stroke="#6366f1" stroke-width="2" class="dash-line" opacity="0.4" />
    <path d="M 100 320 Q 300 260 520 310 T 800 290 T 1100 330" fill="none" stroke="#ec4899" stroke-width="1.8" class="dash-line" opacity="0.35" style="animation-duration: 3.5s;" />

    <!-- Animated Mind Map Nodes on Left -->
    <g class="card-float-1" transform="translate(60, 160)">
      <rect width="130" height="48" rx="10" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" filter="url(#shadow)" opacity="0.85" />
      <circle cx="22" cy="24" r="5" fill="#ec4899" class="beacon" />
      <text x="36" y="28" fill="#e5e7eb" font-size="12" class="font-sub">💡 Ideate</text>
    </g>

    <g class="card-float-2" transform="translate(100, 240)">
      <rect width="140" height="48" rx="10" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" filter="url(#shadow)" opacity="0.85" />
      <circle cx="22" cy="24" r="5" fill="#8b5cf6" class="beacon" style="animation-delay: 1s;" />
      <text x="36" y="28" fill="#e5e7eb" font-size="12" class="font-sub">🗺️ Mind Map</text>
    </g>

    <!-- Animated Sticky Notes / Canvas Cards on Right -->
    <g class="card-float-2" transform="translate(1000, 150)">
      <rect width="140" height="52" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" opacity="0.85" />
      <circle cx="22" cy="26" r="5" fill="#3b82f6" class="beacon" />
      <text x="36" y="30" fill="#e2e8f0" font-size="12" class="font-sub">🎨 Whiteboard</text>
    </g>

    <g class="card-float-1" transform="translate(970, 230)">
      <rect width="150" height="52" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" opacity="0.85" />
      <circle cx="22" cy="26" r="5" fill="#10b981" class="beacon" style="animation-delay: 1.5s;" />
      <text x="36" y="30" fill="#e2e8f0" font-size="12" class="font-sub">⚡ Collaborate</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT (Crystal clear and unobstructed in foreground) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1f2937" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)" />
      <circle cx="-165" cy="0" r="4" fill="#10b981" class="beacon" />
      <text x="5" y="5" fill="#cbd5e1" font-size="13" class="font-sub" letter-spacing="1">CURATED KNOWLEDGE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" font-size="44" class="font-title" fill="url(#primaryGrad)" filter="url(#shadow)" letter-spacing="-0.5">
      Creative Ideation &amp; Brainstorming
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" font-size="20" class="font-sub" fill="#e2e8f0" letter-spacing="0.2">
      Infinite Whiteboards &#8226; Mind Mapping &#8226; Real-Time Visual Collaboration
    </text>

    <!-- Tagline Description -->
    <text x="600" y="245" font-size="14" class="font-sub" fill="#9ca3af" letter-spacing="0.3">
      The authoritative index of enterprise SaaS platforms and self-hosted open-source software
    </text>

    <!-- Interactive Ecosystem Feature Pills -->
    <g transform="translate(600, 315)">
      <!-- Pill 1: Whiteboards -->
      <g transform="translate(-320, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#93c5fd" font-size="12" class="font-sub">📐 Infinite Canvas</text>
      </g>

      <!-- Pill 2: Mind Maps -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#f472b6" font-size="12" class="font-sub">🧠 Mind Mapping</text>
      </g>

      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#c084fc" font-size="12" class="font-sub">🔒 Self-Hosted</text>
      </g>

      <!-- Pill 4: Real-Time Sprints -->
      <g transform="translate(160, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#34d399" font-size="12" class="font-sub">🚀 Agile Sprints</text>
      </g>

      <!-- Pill 5: Diagram as Code -->
      <g transform="translate(320, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#facc15" font-size="12" class="font-sub">💻 Diagram-as-Code</text>
      </g>
    </g>
  </g>
</svg>
